# skillrosa static site. __ROOT__ and __HOST__ are filled in by install.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    root __ROOT__;
    index index.html;

    gzip on;
    gzip_types application/json text/plain application/atom+xml text/css application/javascript;
    gzip_min_length 1024;

    # AI agents and other sites may read the catalog from a browser, so allow CORS.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The index changes hourly: always revalidate; assets can be cached briefly.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    # Serve .txt/.json/.xml with explicit UTF-8 so agents decode Turkish text correctly.
    charset utf-8;
}
